[package]
name = "tg-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
bytes = "1"
cipher = "0.4"
crc32fast = "1.4"
crossbeam-queue = "0.3"
parking_lot = "0.12"
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
uniffi = { version = "0.28", features = ["cli"] }

[build-dependencies]
uniffi_build = "0.28"

[dev-dependencies]
hex = "0.4"
proptest = "1"

[lib]
crate-type = ["cdylib", "staticlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
rpath = false
